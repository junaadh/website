name: Build portfolio and CV

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the run was triggered ("cv" comes from the admin panel)
        type: string
        default: manual

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` is not available in `if:` expressions, only in `env`/`with`.
    # Mapping it here lets the R2 step below test whether R2 is configured.
    env:
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2
      - name: Lint
        run: bun run lint
      - name: Test theme preferences
        run: bun run test
      - name: Render CV, generate social assets, and build portfolio
        run: bun run build
        env:
          # Renders the CV and social card from what the panel published, so an
          # admin-triggered rebuild matches the live site. Falls back to the
          # committed profile if unset or unreachable.
          SITE_CONFIG_URL: https://junaadh.dev/api/config
      # Catches a broken Function at build time. Without this the site would
      # deploy fine and every /api route would simply 404.
      - name: Compile Pages Functions
        run: bunx wrangler pages functions build --outdir=/tmp/functions-check

      - name: Check PDF and shared profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          node scripts/check-build.mjs
          node scripts/check-social.mjs
      - name: Upload deployable site
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload CV
        uses: actions/upload-artifact@v7
        with:
          name: junaadh-cv
          path: public/cv.pdf
          if-no-files-found: error

      # Typst cannot run in a Worker, so the admin panel's "regenerate CV"
      # triggers this workflow instead and the render lands in R2, where
      # functions/cv.pdf.ts serves it ahead of the deployed copy.
      - name: Publish CV to R2
        # Gated on the credential, not on CLOUDFLARE_DEPLOY_ENABLED: cv.yml
        # writes R2 on every panel rebuild, so a normal deploy must refresh it
        # too or /cv.pdf would keep serving the older object indefinitely.
        if: >-
          github.ref == 'refs/heads/master' &&
          github.event_name != 'pull_request' &&
          env.CF_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: r2 object put portfolio-assets/cv.pdf --file=public/cv.pdf --content-type=application/pdf --remote

  deploy:
    needs: build
    # Enable after adding Cloudflare credentials and disabling duplicate Git builds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://junaadh.dev
    steps:
      # Required before download-artifact: checkout cleans the workspace, and
      # `wrangler pages deploy` compiles functions/ from the working directory —
      # the artifact holds only dist, so without this every Function 404s.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: portfolio-${{ github.sha }}
          path: dist
      - name: Deploy site and freshly rendered CV to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy dist --project-name=website --branch=master
